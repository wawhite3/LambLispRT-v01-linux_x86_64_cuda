<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530">
<rect width="720" height="530" fill="#ffffff"/>
<defs>
  <!-- Orange arrowhead for path direction -->
  <marker id="arro" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#e07020"/>
  </marker>
</defs>

<!-- Title -->
<text x="360" y="26" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#00468c">Bee Strategy — Reactive Coverage Path</text>
<text x="360" y="44" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#556677">drive until obstacle · golden-angle turn · repeat · traversed cells recorded</text>

<!-- Room outline  (x=80..640, y=60..440) -->
<rect x="80" y="60" width="560" height="380" rx="4" fill="#f5f8ff" stroke="#334455" stroke-width="2"/>

<!-- Internal obstacle -->
<rect x="300" y="220" width="110" height="110" rx="3" fill="#c8d0d8" stroke="#556677" stroke-width="1.5"/>
<text x="355" y="278" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="bold" fill="#334455">obstacle</text>

<!-- ══════════════════════════════════
     Path segments (teal trail dots)
     Computed from the mathematical
     golden-angle bee walk described
     in the text.
     seg1: (160,400)→(640,400)  E
     seg2: (640,400)→(292,60)   137.5°
     seg3: (292,60)→(324,440)   275°
     seg4: (324,440)→(387,320)  52.5° (hits obstacle bottom)
     seg5: (387,320)→(80,373)   190°
     ══════════════════════════════════ -->

<!-- Seg 1 dots: (160,400)→(640,400), step=22 -->
<circle cx="160" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="182" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="204" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="226" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="248" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="270" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="292" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="314" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="336" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="358" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="380" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="402" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="424" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="446" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="468" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="490" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="512" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="534" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="556" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="578" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="600" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="622" cy="400" r="3" fill="#2a9d8f"/>
<!-- arrowhead direction on seg1 -->
<line x1="610" y1="400" x2="638" y2="400" stroke="#e07020" stroke-width="2" marker-end="url(#arro)"/>

<!-- Seg 2 dots: (640,400)→(292,60)
     dir: cos(137.5°)=-0.7373, sin=-(-0.6756)=+0.6756 upward
     SVG dy = -sin(137.5°)*px = -0.6756
     SVG dx = cos(137.5°)*px = -0.7373
     ~452px total, step 20 → 22 dots -->
<circle cx="627" cy="387" r="3" fill="#2a9d8f"/>
<circle cx="613" cy="373" r="3" fill="#2a9d8f"/>
<circle cx="598" cy="360" r="3" fill="#2a9d8f"/>
<circle cx="583" cy="347" r="3" fill="#2a9d8f"/>
<circle cx="568" cy="334" r="3" fill="#2a9d8f"/>
<circle cx="553" cy="320" r="3" fill="#2a9d8f"/>
<circle cx="538" cy="307" r="3" fill="#2a9d8f"/>
<circle cx="524" cy="294" r="3" fill="#2a9d8f"/>
<circle cx="509" cy="281" r="3" fill="#2a9d8f"/>
<circle cx="494" cy="267" r="3" fill="#2a9d8f"/>
<circle cx="479" cy="254" r="3" fill="#2a9d8f"/>
<circle cx="464" cy="241" r="3" fill="#2a9d8f"/>
<circle cx="449" cy="228" r="3" fill="#2a9d8f"/>
<circle cx="435" cy="214" r="3" fill="#2a9d8f"/>
<circle cx="420" cy="201" r="3" fill="#2a9d8f"/>
<circle cx="405" cy="188" r="3" fill="#2a9d8f"/>
<circle cx="390" cy="175" r="3" fill="#2a9d8f"/>
<circle cx="375" cy="161" r="3" fill="#2a9d8f"/>
<circle cx="361" cy="148" r="3" fill="#2a9d8f"/>
<circle cx="346" cy="135" r="3" fill="#2a9d8f"/>
<circle cx="331" cy="122" r="3" fill="#2a9d8f"/>
<circle cx="316" cy="108" r="3" fill="#2a9d8f"/>
<circle cx="301" cy="95"  r="3" fill="#2a9d8f"/>
<!-- arrowhead on seg2 -->
<line x1="308" y1="100" x2="294" y2="62" stroke="#e07020" stroke-width="2" marker-end="url(#arro)"/>

<!-- Seg 3 dots: (292,60)→(324,440)
     dir: cos(275°)=0.0872, sin(275°)=-0.9962 → SVG dy=+0.9962 (south), dx=+0.0872
     ~380px total, step 20 → 19 dots -->
<circle cx="294" cy="80"  r="3" fill="#2a9d8f"/>
<circle cx="296" cy="100" r="3" fill="#2a9d8f"/>
<circle cx="298" cy="120" r="3" fill="#2a9d8f"/>
<circle cx="300" cy="140" r="3" fill="#2a9d8f"/>
<circle cx="302" cy="160" r="3" fill="#2a9d8f"/>
<circle cx="304" cy="180" r="3" fill="#2a9d8f"/>
<circle cx="306" cy="200" r="3" fill="#2a9d8f"/>
<circle cx="308" cy="220" r="3" fill="#2a9d8f"/>
<circle cx="310" cy="240" r="3" fill="#2a9d8f"/>
<circle cx="312" cy="260" r="3" fill="#2a9d8f"/>
<circle cx="314" cy="280" r="3" fill="#2a9d8f"/>
<circle cx="316" cy="300" r="3" fill="#2a9d8f"/>
<circle cx="318" cy="320" r="3" fill="#2a9d8f"/>
<circle cx="320" cy="340" r="3" fill="#2a9d8f"/>
<circle cx="322" cy="360" r="3" fill="#2a9d8f"/>
<circle cx="323" cy="380" r="3" fill="#2a9d8f"/>
<circle cx="324" cy="400" r="3" fill="#2a9d8f"/>
<circle cx="324" cy="420" r="3" fill="#2a9d8f"/>
<!-- arrowhead on seg3 -->
<line x1="324" y1="418" x2="324" y2="438" stroke="#e07020" stroke-width="2" marker-end="url(#arro)"/>

<!-- Seg 4 dots: (324,440)→(387,320) — stops at obstacle bottom face
     dir: cos(52.5°)=0.6088, sin(52.5°)=0.7934 → SVG: dx=+0.6088, dy=-0.7934
     hits obstacle at (387,320), ~155px
     step 18 → 8 dots -->
<circle cx="335" cy="431" r="3" fill="#2a9d8f"/>
<circle cx="346" cy="422" r="3" fill="#2a9d8f"/>
<circle cx="357" cy="413" r="3" fill="#2a9d8f"/>
<circle cx="368" cy="404" r="3" fill="#2a9d8f"/>
<circle cx="378" cy="396" r="3" fill="#2a9d8f"/>
<!-- arrowhead on seg4 -->
<line x1="375" y1="397" x2="385" y2="322" stroke="#e07020" stroke-width="2" marker-end="url(#arro)"/>

<!-- Seg 5 dots: (387,320)→(80,373)
     dir: cos(190°)=-0.9848, sin(190°)=-0.1736 → SVG: dx=-0.9848, dy=+0.1736
     ~312px total, step 20 → 15 dots -->
<circle cx="367" cy="323" r="3" fill="#2a9d8f"/>
<circle cx="347" cy="327" r="3" fill="#2a9d8f"/>
<circle cx="327" cy="330" r="3" fill="#2a9d8f"/>
<circle cx="307" cy="334" r="3" fill="#2a9d8f"/>
<circle cx="287" cy="337" r="3" fill="#2a9d8f"/>
<circle cx="267" cy="341" r="3" fill="#2a9d8f"/>
<circle cx="247" cy="344" r="3" fill="#2a9d8f"/>
<circle cx="227" cy="348" r="3" fill="#2a9d8f"/>
<circle cx="207" cy="351" r="3" fill="#2a9d8f"/>
<circle cx="187" cy="355" r="3" fill="#2a9d8f"/>
<circle cx="167" cy="358" r="3" fill="#2a9d8f"/>
<circle cx="147" cy="362" r="3" fill="#2a9d8f"/>
<circle cx="127" cy="365" r="3" fill="#2a9d8f"/>
<circle cx="107" cy="369" r="3" fill="#2a9d8f"/>
<!-- arrowhead on seg5 -->
<line x1="114" y1="368" x2="82" y2="374" stroke="#e07020" stroke-width="2" marker-end="url(#arro)"/>

<!-- ══ Obstacle-hit markers (orange X) ══ -->
<!-- Hit 1: east wall (640,400) -->
<line x1="630" y1="390" x2="650" y2="410" stroke="#e05020" stroke-width="2.5"/>
<line x1="650" y1="390" x2="630" y2="410" stroke="#e05020" stroke-width="2.5"/>
<!-- Hit 2: north wall (292,60) -->
<line x1="282" y1="50" x2="302" y2="70" stroke="#e05020" stroke-width="2.5"/>
<line x1="302" y1="50" x2="282" y2="70" stroke="#e05020" stroke-width="2.5"/>
<!-- Hit 3: south wall (324,440) -->
<line x1="314" y1="430" x2="334" y2="450" stroke="#e05020" stroke-width="2.5"/>
<line x1="334" y1="430" x2="314" y2="450" stroke="#e05020" stroke-width="2.5"/>
<!-- Hit 4: obstacle bottom face (387,320) -->
<line x1="377" y1="310" x2="397" y2="330" stroke="#e05020" stroke-width="2.5"/>
<line x1="397" y1="310" x2="377" y2="330" stroke="#e05020" stroke-width="2.5"/>
<!-- Hit 5: west wall (80,373) -->
<line x1="70" y1="363" x2="90" y2="383" stroke="#e05020" stroke-width="2.5"/>
<line x1="90" y1="363" x2="70" y2="383" stroke="#e05020" stroke-width="2.5"/>

<!-- ══ Heading angle labels at each turn ══ -->
<!-- Turn 1 (at east wall hit, turning to 137.5°) -->
<rect x="646" y="380" width="66" height="28" rx="3" fill="#fff8e8" stroke="#cc8800" stroke-width="0.8"/>
<text x="679" y="393" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="bold" fill="#8a4000">hit wall</text>
<text x="679" y="404" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8a4000">turn 137.5°</text>

<!-- Turn 2 (at north wall, turning to 275°) -->
<rect x="216" y="40" width="66" height="28" rx="3" fill="#fff8e8" stroke="#cc8800" stroke-width="0.8"/>
<text x="249" y="53" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="bold" fill="#8a4000">hit wall</text>
<text x="249" y="64" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8a4000">turn 275°</text>

<!-- Turn 3 (at south wall, turning to 52.5°) -->
<rect x="265" y="450" width="66" height="28" rx="3" fill="#fff8e8" stroke="#cc8800" stroke-width="0.8"/>
<text x="298" y="463" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="bold" fill="#8a4000">hit wall</text>
<text x="298" y="474" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8a4000">turn 52.5°</text>

<!-- Turn 4 (obstacle hit, turning to 190°) -->
<rect x="400" y="302" width="72" height="28" rx="3" fill="#fff8e8" stroke="#cc8800" stroke-width="0.8"/>
<text x="436" y="315" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="bold" fill="#8a4000">hit obstacle</text>
<text x="436" y="326" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8a4000">turn 190°</text>

<!-- Turn 5 (west wall) -->
<rect x="2" y="356" width="66" height="28" rx="3" fill="#fff8e8" stroke="#cc8800" stroke-width="0.8"/>
<text x="35" y="369" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" font-weight="bold" fill="#8a4000">hit wall</text>
<text x="35" y="380" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#8a4000">(continuing)</text>

<!-- Start marker -->
<circle cx="160" cy="400" r="9" fill="none" stroke="#2a9d8f" stroke-width="2.5"/>
<text x="162" y="418" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="9" fill="#2a9d8f" font-weight="bold">start</text>

<!-- Heading label on seg1 -->
<text x="390" y="392" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#556677">0°  (east)</text>

<!-- Heading label on seg2 -->
<text x="510" y="225" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#556677" transform="rotate(-43 510 225)">137.5°</text>

<!-- Heading label on seg3 -->
<text x="340" y="270" text-anchor="start"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#556677">275°</text>

<!-- Heading label on seg4 -->
<text x="320" y="406" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#556677" transform="rotate(-55 320 406)">52.5°</text>

<!-- Heading label on seg5 -->
<text x="236" y="336" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#556677" transform="rotate(-10 236 336)">190°</text>

<!-- Legend -->
<rect x="466" y="456" width="248" height="58" rx="4" fill="#ffffff" stroke="#c8d8ee" stroke-width="1"/>
<circle cx="482" cy="470" r="4" fill="#2a9d8f"/>
<text x="492" y="474" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#334455">traversed cell (unblocked, on bee-path)</text>
<line x1="476" y1="490" x2="490" y2="490" stroke="#e05020" stroke-width="2"/>
<line x1="490" y1="484" x2="476" y2="496" stroke="#e05020" stroke-width="2"/>
<text x="496" y="494" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#334455">obstacle hit — golden-angle turn</text>
<rect x="466" y="504" width="248" height="1" fill="none"/>
</svg>
