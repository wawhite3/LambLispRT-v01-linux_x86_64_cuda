<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="560" viewBox="0 0 1050 560">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#00468c"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#2d7a2d"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1050" height="560" fill="#f8fafc"/>

  <!-- Title -->
  <text x="525" y="38" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="bold" fill="#00468c">Argument Evaluation: lambda vs. nlambda vs. macro</text>

  <!-- Column dividers -->
  <line x1="350" y1="60" x2="350" y2="540" stroke="#c8d4e0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="60" x2="700" y2="540" stroke="#c8d4e0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Column headers -->
  <rect x="30" y="62" width="290" height="38" rx="6" fill="#00468c"/>
  <text x="175" y="86" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="19" font-weight="bold" fill="white">lambda</text>

  <rect x="380" y="62" width="290" height="38" rx="6" fill="#1a6abf"/>
  <text x="525" y="86" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="19" font-weight="bold" fill="white">nlambda</text>

  <rect x="730" y="62" width="290" height="38" rx="6" fill="#2d5a8c"/>
  <text x="875" y="86" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="19" font-weight="bold" fill="white">macro</text>

  <!-- ROW 1: Call site -->
  <rect x="40" y="122" width="270" height="52" rx="5" fill="#d0e8ff" stroke="#00468c" stroke-width="1.5"/>
  <text x="175" y="143" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="15" fill="#0d1a2e">(my-fn (+ 1 2) x)</text>
  <text x="175" y="163" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#8899aa">call site</text>

  <rect x="390" y="122" width="270" height="52" rx="5" fill="#d0e8ff" stroke="#1a6abf" stroke-width="1.5"/>
  <text x="525" y="143" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="15" fill="#0d1a2e">(my-fn (+ 1 2) x)</text>
  <text x="525" y="163" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#8899aa">call site</text>

  <rect x="740" y="122" width="270" height="52" rx="5" fill="#d0e8ff" stroke="#2d5a8c" stroke-width="1.5"/>
  <text x="875" y="143" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="15" fill="#0d1a2e">(my-fn (+ 1 2) x)</text>
  <text x="875" y="163" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#8899aa">call site</text>

  <!-- Arrows row 1→2 -->
  <line x1="175" y1="174" x2="175" y2="208" stroke="#00468c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="525" y1="174" x2="525" y2="208" stroke="#1a6abf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="875" y1="174" x2="875" y2="208" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ROW 2: What happens to args -->
  <rect x="40" y="210" width="270" height="60" rx="5" fill="#fff3cd" stroke="#cc8800" stroke-width="1.5"/>
  <text x="175" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">eval each argument</text>
  <text x="175" y="252" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#553300">(+ 1 2) → 3,  x → 7</text>
  <text x="175" y="268" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">in caller's environment</text>

  <rect x="390" y="210" width="270" height="60" rx="5" fill="#f8e8ff" stroke="#6a2d8c" stroke-width="1.5"/>
  <text x="525" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">args passed unevaluated</text>
  <text x="525" y="252" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#3d0060">((+ 1 2) x)</text>
  <text x="525" y="268" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">raw forms, as a list</text>

  <rect x="740" y="210" width="270" height="60" rx="5" fill="#f8e8ff" stroke="#6a2d8c" stroke-width="1.5"/>
  <text x="875" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">args bound to formals</text>
  <text x="875" y="252" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#3d0060">in definition environment</text>
  <text x="875" y="268" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">unevaluated</text>

  <!-- Arrows row 2→3 -->
  <line x1="175" y1="270" x2="175" y2="308" stroke="#00468c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="525" y1="270" x2="525" y2="308" stroke="#1a6abf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="875" y1="270" x2="875" y2="308" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ROW 3: Body execution -->
  <rect x="40" y="310" width="270" height="60" rx="5" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="175" y="333" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">body executes</text>
  <text x="175" y="353" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1a4a1a">with values: 3, 7</text>
  <text x="175" y="368" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">in closure environment</text>

  <rect x="390" y="310" width="270" height="60" rx="5" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="525" y="333" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">body executes</text>
  <text x="525" y="353" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#1a4a1a">with forms: (+ 1 2), x</text>
  <text x="525" y="368" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">in definition environment</text>

  <rect x="740" y="310" width="270" height="60" rx="5" fill="#fff3cd" stroke="#cc8800" stroke-width="1.5"/>
  <text x="875" y="333" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">body produces</text>
  <text x="875" y="353" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#553300">an expansion form</text>
  <text x="875" y="368" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">in definition environment</text>

  <!-- Extra macro arrow -->
  <line x1="875" y1="370" x2="875" y2="408" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Macro extra box -->
  <rect x="740" y="410" width="270" height="52" rx="5" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="875" y="432" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d1a2e">expansion evaluated</text>
  <text x="875" y="451" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">in caller's environment</text>

  <!-- Arrows to result -->
  <line x1="175" y1="370" x2="175" y2="460" stroke="#00468c" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="525" y1="370" x2="525" y2="460" stroke="#1a6abf" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="875" y1="462" x2="875" y2="478" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Result boxes -->
  <rect x="80" y="462" width="190" height="42" rx="5" fill="#00468c"/>
  <text x="175" y="488" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">value</text>

  <rect x="430" y="462" width="190" height="42" rx="5" fill="#1a6abf"/>
  <text x="525" y="488" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">value or side-effect</text>

  <rect x="780" y="480" width="190" height="42" rx="5" fill="#2d5a8c"/>
  <text x="875" y="506" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" fill="white">value</text>

  <!-- Legend -->
  <rect x="30" y="528" width="18" height="12" rx="2" fill="#fff3cd" stroke="#cc8800" stroke-width="1"/>
  <text x="54" y="539" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#553300">args evaluated</text>
  <rect x="200" y="528" width="18" height="12" rx="2" fill="#f8e8ff" stroke="#6a2d8c" stroke-width="1"/>
  <text x="224" y="539" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#3d0060">args unevaluated</text>
  <rect x="390" y="528" width="18" height="12" rx="2" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1"/>
  <text x="414" y="539" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#1a4a1a">body executes / expands</text>
</svg>
