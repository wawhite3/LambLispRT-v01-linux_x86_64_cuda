<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="480" viewBox="0 0 1050 480">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#00468c"/>
    </marker>
    <marker id="arrw" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="white"/>
    </marker>
  </defs>

  <rect width="1050" height="480" fill="#f8fafc"/>

  <!-- Title -->
  <text x="525" y="36" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="bold" fill="#00468c">Hardware Device Access Patterns</text>

  <!-- Column dividers -->
  <line x1="350" y1="55" x2="350" y2="460" stroke="#c8d4e0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="55" x2="700" y2="460" stroke="#c8d4e0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Column headers -->
  <rect x="25" y="55" width="300" height="40" rx="6" fill="#00468c"/>
  <text x="175" y="81" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">Direct GPIO / Analog</text>

  <rect x="375" y="55" width="300" height="40" rx="6" fill="#1a6abf"/>
  <text x="525" y="81" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">I2C (Wire)</text>

  <rect x="725" y="55" width="300" height="40" rx="6" fill="#2d5a8c"/>
  <text x="875" y="81" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="white">SPI / WS2812 / DMA</text>

  <!-- GPIO column -->
  <rect x="50" y="118" width="250" height="44" rx="5" fill="#d0e8ff" stroke="#00468c" stroke-width="1.5"/>
  <text x="175" y="137" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="15" fill="#0d1a2e">(digitalWrite 38 #t)</text>
  <text x="175" y="155" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">LambLisp call</text>

  <line x1="175" y1="162" x2="175" y2="193" stroke="#00468c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="65" y="195" width="220" height="44" rx="5" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="175" y="215" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#1a4a1a">mop3_cio_digitalWrite</text>
  <text x="175" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">C++ mop3</text>

  <line x1="175" y1="239" x2="175" y2="270" stroke="#00468c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="65" y="272" width="220" height="44" rx="5" fill="#fff3cd" stroke="#cc8800" stroke-width="1.5"/>
  <text x="175" y="292" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#553300">Arduino digitalWrite()</text>
  <text x="175" y="308" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">Arduino HAL</text>

  <line x1="175" y1="316" x2="175" y2="347" stroke="#00468c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="80" y="349" width="190" height="55" rx="8" fill="#0d1a2e" stroke="#00468c" stroke-width="2"/>
  <text x="175" y="371" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="white">GPIO Pin 38</text>
  <text x="175" y="390" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">HIGH / LOW</text>
  <text x="175" y="406" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">single register write</text>

  <!-- I2C column -->
  <rect x="400" y="118" width="250" height="44" rx="5" fill="#d0e8ff" stroke="#1a6abf" stroke-width="1.5"/>
  <text x="525" y="137" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="15" fill="#0d1a2e">(Wire.write addr cmd)</text>
  <text x="525" y="155" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">LambLisp call</text>

  <line x1="525" y1="162" x2="525" y2="193" stroke="#1a6abf" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="415" y="195" width="220" height="44" rx="5" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="525" y="215" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#1a4a1a">Wire_mop3_write</text>
  <text x="525" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">C++ mop3</text>

  <line x1="525" y1="239" x2="525" y2="270" stroke="#1a6abf" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="415" y="272" width="220" height="44" rx="5" fill="#fff3cd" stroke="#cc8800" stroke-width="1.5"/>
  <text x="525" y="292" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#553300">Wire.write() / endTransmission()</text>
  <text x="525" y="308" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">Arduino Wire lib</text>

  <line x1="525" y1="316" x2="525" y2="347" stroke="#1a6abf" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="415" y="349" width="220" height="55" rx="8" fill="#0d1a2e" stroke="#1a6abf" stroke-width="2"/>
  <text x="525" y="371" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="white">I2C Bus</text>
  <text x="525" y="390" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">SDA / SCL</text>
  <text x="525" y="406" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">cmd/response, multi-device</text>

  <!-- SPI/WS2812 column -->
  <rect x="750" y="118" width="250" height="44" rx="5" fill="#d0e8ff" stroke="#2d5a8c" stroke-width="1.5"/>
  <text x="875" y="137" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="15" fill="#0d1a2e">(WS2812.write pixels)</text>
  <text x="875" y="155" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">LambLisp call</text>

  <line x1="875" y1="162" x2="875" y2="193" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="765" y="195" width="220" height="44" rx="5" fill="#e8f5e8" stroke="#2d7a2d" stroke-width="1.5"/>
  <text x="875" y="215" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#1a4a1a">mop3_ws2812_write</text>
  <text x="875" y="232" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">C++ mop3</text>

  <line x1="875" y1="239" x2="875" y2="270" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="765" y="272" width="220" height="44" rx="5" fill="#fff3cd" stroke="#cc8800" stroke-width="1.5"/>
  <text x="875" y="292" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" fill="#553300">RMT / DMA peripheral</text>
  <text x="875" y="308" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">hardware serializer</text>

  <line x1="875" y1="316" x2="875" y2="347" stroke="#2d5a8c" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="765" y="349" width="220" height="55" rx="8" fill="#0d1a2e" stroke="#2d5a8c" stroke-width="2"/>
  <text x="875" y="371" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="white">LED Strip / SPI Device</text>
  <text x="875" y="390" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8899aa">single data line</text>
  <text x="875" y="406" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#8899aa">bulk transfer, point-to-point</text>

  <!-- Bottom label -->
  <text x="525" y="458" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-style="italic" fill="#8899aa">All patterns use the same mop3 C++ extension mechanism; only the hardware protocol differs.</text>
</svg>
