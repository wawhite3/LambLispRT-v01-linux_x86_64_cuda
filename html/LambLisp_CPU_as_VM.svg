<svg xmlns="http://www.w3.org/2000/svg" width="950" height="510" viewBox="0 0 950 510">
<rect width="950" height="510" fill="#ffffff"/>
<defs>
  <marker id="uarr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#8899aa"/>
  </marker>
</defs>

<!-- Title -->
<text x="475" y="32" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="bold" fill="#00468c">Computer Programs Sit at the Top of a Stack of Virtual Machines</text>

<!-- ══════════════════════════════════════════
     Programs / Software (top)  y=48..156
     ══════════════════════════════════════════ -->
<rect x="60" y="48" width="830" height="108" rx="8"
      fill="#d0e8ff" stroke="#00468c" stroke-width="2"/>
<line x1="262" y1="48" x2="262" y2="156" stroke="#00468c" stroke-width="0.7" opacity="0.35"/>

<text x="161" y="90" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="bold" fill="#00468c">Programs</text>
<text x="161" y="112" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-style="italic" fill="#1a5090">software virtual machines</text>
<text x="161" y="131" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#6688aa">→ Figure 12</text>

<text x="576" y="82" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0d1a2e">machine code · operating system · runtime libraries · device drivers</text>
<text x="576" y="102" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0d1a2e">application algorithms · LambLisp VM</text>
<text x="576" y="126" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-style="italic" fill="#556677">inputs: external events — outputs: control actions and data</text>

<!-- ══════════════════════════════════════════
     Hardware / Software Boundary
     ══════════════════════════════════════════ -->
<line x1="50" y1="166" x2="900" y2="166" stroke="#cc4444" stroke-width="1.8" stroke-dasharray="10,5"/>
<text x="475" y="181" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="bold" fill="#cc4444">—— Hardware Virtual Machines ——</text>

<!-- ══════════════════════════════════════════
     CPU  y=188..258
     ══════════════════════════════════════════ -->
<rect x="60" y="188" width="830" height="70" rx="8"
      fill="#ccd5e8" stroke="#3355aa" stroke-width="1.8"/>
<line x1="262" y1="188" x2="262" y2="258" stroke="#3355aa" stroke-width="0.6" opacity="0.4"/>

<text x="161" y="221" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a3080">CPU</text>
<text x="161" y="244" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#3355aa">instruction decoder · ALU</text>

<text x="576" y="214" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0d1a2e">instruction decoder · ALU · register file · memory hierarchy · interrupt controller</text>
<text x="576" y="238" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334466">provides: integers · addresses · instruction opcodes · program flow</text>

<!-- ══════════════════════════════════════════
     Micro-machines  y=266..336
     ══════════════════════════════════════════ -->
<rect x="60" y="266" width="830" height="70" rx="8"
      fill="#dae2ef" stroke="#5566aa" stroke-width="1.8"/>
<line x1="262" y1="266" x2="262" y2="336" stroke="#5566aa" stroke-width="0.6" opacity="0.4"/>

<text x="161" y="299" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#223355">Micro-machines</text>
<text x="161" y="322" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#4455aa">adder · register · SRAM</text>

<text x="576" y="292" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0d1a2e">adder · multiplier · comparator · register file · SRAM · multiplexer</text>
<text x="576" y="316" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334466">provides: arithmetic results · stored values · selected outputs</text>

<!-- ══════════════════════════════════════════
     Logic Gates  y=344..414
     ══════════════════════════════════════════ -->
<rect x="60" y="344" width="830" height="70" rx="8"
      fill="#e8edf5" stroke="#7788aa" stroke-width="1.8"/>
<line x1="262" y1="344" x2="262" y2="414" stroke="#7788aa" stroke-width="0.6" opacity="0.4"/>

<text x="161" y="377" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#334466">Logic Gates</text>
<text x="161" y="400" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#6677aa">AND · OR · NOT · XOR</text>

<text x="576" y="370" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0d1a2e">AND · OR · NOT · XOR · flip-flop · latch · tri-state buffer</text>
<text x="576" y="394" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#334466">provides: Boolean algebra — 0 and 1</text>

<!-- ══════════════════════════════════════════
     Field-Effect Transistor  y=422..492
     ══════════════════════════════════════════ -->
<rect x="60" y="422" width="830" height="70" rx="8"
      fill="#f2f2f2" stroke="#9999aa" stroke-width="1.8"/>
<line x1="262" y1="422" x2="262" y2="492" stroke="#9999aa" stroke-width="0.6" opacity="0.4"/>

<text x="161" y="455" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#445566">Field-Effect Transistor</text>
<text x="161" y="478" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#778899">gate voltage → current flow</text>

<text x="576" y="448" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#0d1a2e">gate voltage controls electron flow through semiconductor substrate</text>
<text x="576" y="472" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" fill="#556677">provides: conducting / non-conducting → one bit of information</text>

<!-- ══════════════════════════════════════════
     Upward arrows between hardware layers
     (right side, showing abstraction direction)
     ══════════════════════════════════════════ -->
<!-- FET → Logic Gates -->
<line x1="858" y1="420" x2="858" y2="346" stroke="#8899aa" stroke-width="1.5" marker-end="url(#uarr)"/>
<!-- Logic Gates → Micro-machines -->
<line x1="858" y1="342" x2="858" y2="268" stroke="#8899aa" stroke-width="1.5" marker-end="url(#uarr)"/>
<!-- Micro-machines → CPU -->
<line x1="858" y1="264" x2="858" y2="190" stroke="#8899aa" stroke-width="1.5" marker-end="url(#uarr)"/>

<!-- "abstraction" label, rotated, beside the arrows -->
<text x="878" y="328" text-anchor="middle"
      transform="rotate(-90 878 328)"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="12" font-style="italic" fill="#8899aa">abstraction ↑</text>

</svg>
