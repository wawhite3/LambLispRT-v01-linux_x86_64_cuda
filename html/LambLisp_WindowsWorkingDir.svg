<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520">
<rect width="960" height="520" fill="#ffffff"/>
<defs><marker id="arrg" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#228844"/></marker><marker id="arrr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#cc4444"/></marker></defs>
<text x="480" y="34" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="bold" font-style="normal" fill="#00468c">Windows: the working directory is what finds the library</text>
<text x="480" y="56" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#445566">LambLisp.exe resolves data\setup.scm by RELATIVE path. The folder you start from IS the configuration.</text>
<line x1="480" y1="74" x2="480" y2="392" stroke="#8899aa" stroke-width="1" stroke-dasharray="4,3"/>
<text x="258" y="98" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#228844">STARTED IN THE UNPACKED FOLDER</text>
<rect x="58" y="114" width="400" height="268" rx="8" fill="#f4fbf4" stroke="#228844" stroke-width="1.5"/>
<rect x="80" y="134" width="356" height="32" rx="6" fill="#e8f2ff" stroke="#1a6abf" stroke-width="1.5"/>
<text x="258" y="156" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#00468c">cwd = ...\LambLispRT-v01-windows_x86_64</text>
<rect x="80" y="178" width="356" height="38" rx="6" fill="#d4f7d4" stroke="#228844" stroke-width="1.8"/>
<text x="258" y="203" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="16" font-weight="bold" font-style="normal" fill="#1a6633">LambLisp.exe</text>
<line x1="258" y1="220" x2="258" y2="250" stroke="#228844" stroke-width="2" marker-end="url(#arrg)"/>
<text x="450" y="240" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#445566">opens  data\setup.scm</text>
<rect x="80" y="254" width="356" height="38" rx="6" fill="#ffe8b0" stroke="#cc8800" stroke-width="1.8"/>
<text x="258" y="279" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" font-weight="bold" font-style="normal" fill="#8a5a00">data\setup.scm   found</text>
<line x1="258" y1="296" x2="258" y2="326" stroke="#228844" stroke-width="2" marker-end="url(#arrg)"/>
<rect x="80" y="330" width="356" height="36" rx="6" fill="#d4f7d4" stroke="#228844" stroke-width="1.8"/>
<text x="258" y="354" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="19" font-weight="bold" font-style="normal" fill="#228844">LL=&gt;</text>
<text x="702" y="98" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#cc4444">STARTED FROM ANYWHERE ELSE</text>
<rect x="502" y="114" width="400" height="268" rx="8" fill="#fdf6f6" stroke="#cc4444" stroke-width="1.5"/>
<rect x="524" y="134" width="356" height="32" rx="6" fill="#e8f2ff" stroke="#1a6abf" stroke-width="1.5"/>
<text x="702" y="156" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="13" font-weight="normal" font-style="normal" fill="#00468c">cwd = C:\Users\you</text>
<rect x="524" y="178" width="356" height="38" rx="6" fill="#d4f7d4" stroke="#228844" stroke-width="1.8"/>
<text x="702" y="203" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="16" font-weight="bold" font-style="normal" fill="#1a6633">LambLisp.exe   (on PATH)</text>
<line x1="702" y1="220" x2="702" y2="250" stroke="#cc4444" stroke-width="2" marker-end="url(#arrr)"/>
<text x="894" y="240" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#445566">looks for  .\data\setup.scm</text>
<rect x="524" y="254" width="356" height="38" rx="6" fill="#fdecec" stroke="#cc4444" stroke-width="1.8"/>
<text x="702" y="279" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="14" font-weight="bold" font-style="normal" fill="#8a2020">not there</text>
<line x1="702" y1="296" x2="702" y2="326" stroke="#cc4444" stroke-width="2" marker-end="url(#arrr)"/>
<rect x="524" y="330" width="356" height="36" rx="6" fill="#fdecec" stroke="#cc4444" stroke-width="1.8"/>
<text x="702" y="354" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="13" font-weight="bold" font-style="normal" fill="#cc4444">cannot open input file: setup.scm</text>
<rect x="58" y="406" width="844" height="98" rx="8" fill="#f2f6fb" stroke="#1a6abf" stroke-width="1.5"/>
<text x="480" y="430" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#00468c">TWO WAYS TO LAUNCH IT FROM ANYWHERE — both set the working directory; PATH alone does not</text>
<text x="210" y="456" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#00468c">A shortcut</text>
<text x="210" y="476" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#445566">Properties → Start in →</text>
<text x="210" y="494" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="normal" font-style="normal" fill="#445566">the unpacked folder</text>
<line x1="370" y1="446" x2="370" y2="498" stroke="#8899aa" stroke-width="1" stroke-dasharray="4,3"/>
<text x="650" y="456" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#00468c">A one-line batch file on PATH</text>
<text x="650" y="478" text-anchor="middle" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="normal" font-style="normal" fill="#00468c">@cd /d "C:\...\LambLispRT-v01-windows_x86_64" &amp;&amp; LambLisp.exe %*</text>
<text x="650" y="496" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="normal" font-style="italic" fill="#445566">(double-clicking the .exe also works — Explorer sets the folder)</text>
</svg>
