<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430">
<rect width="980" height="430" fill="#ffffff"/>
<defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#c03030"/></marker></defs>
<text x="490" y="34" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" fill="#00468c" text-anchor="middle" font-weight="bold">The native-code pool is a budget, not a cache</text>
<text x="490" y="56" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#8899aa" text-anchor="middle" font-style="italic">ESP32-S3 · 32 KB internal D/IRAM · measured on esp32s3-n8r2-00</text>
<rect x="60" y="96" width="860" height="66" rx="5" fill="#eef2f7" stroke="#8899aa" stroke-width="1.4"/>
<rect x="60.0" y="96" width="41.55523003472222" height="66" rx="2" fill="#ffe0c2" stroke="#b35c00" stroke-width="1.1"/>
