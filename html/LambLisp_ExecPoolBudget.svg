<rect x="364.88661024305554" y="96" width="41.55523003472222" height="66" rx="2" fill="#ffe0c2" stroke="#b35c00" stroke-width="1.1"/>
<rect x="408.44184027777777" y="96" width="41.55523003472222" height="66" rx="2" fill="#ffe0c2" stroke="#b35c00" stroke-width="1.1"/>
<rect x="451.9970703125" y="96" width="41.55523003472222" height="66" rx="2" fill="#ffe0c2" stroke="#b35c00" stroke-width="1.1"/>
<rect x="495.55230034722223" y="96" width="41.55523003472222" height="66" rx="2" fill="#ffe0c2" stroke="#b35c00" stroke-width="1.1"/>
<rect x="539.1075303819445" y="96" width="41.55523003472222" height="66" rx="2" fill="#ffe0c2" stroke="#b35c00" stroke-width="1.1"/>
