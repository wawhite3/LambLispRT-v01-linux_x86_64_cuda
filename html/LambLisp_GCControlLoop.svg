<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="350" viewBox="0 0 1050 350">
<rect width="1050" height="350" fill="#ffffff"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#00468c"/></marker>
  <marker id="arrloop" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0,9 3.5,0 7" fill="#228844"/></marker>
</defs>

<!-- Title -->
<text x="525" y="30" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="23.0" font-weight="bold" fill="#00468c">GC Quanta in a 10 ms Real-Time Control Loop</text>
<text x="525" y="50" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" font-style="italic" fill="#8899aa">not to scale — GC quanta are ~50 µs each; the control loop is 10 000 µs</text>

<!-- 10 ms bracket -->
<line x1="80" y1="68" x2="970" y2="68" stroke="#00468c" stroke-width="1.4"/>
<line x1="80" y1="64" x2="80" y2="72" stroke="#00468c" stroke-width="1.4"/>
<line x1="970" y1="64" x2="970" y2="72" stroke="#00468c" stroke-width="1.4"/>
<text x="525" y="64" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.2" font-weight="bold" fill="#00468c">10 ms</text>

<!-- Row labels -->
<text x="72" y="113" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.2" fill="#1a6abf">user + eval</text>
<text x="72" y="159" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.2" fill="#e8a020">GC quantum</text>
<text x="72" y="205" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.2" fill="#228844">idle GC bonus</text>

<!-- Horizontal grid lines -->
<line x1="80" y1="75" x2="970" y2="75" stroke="#f0f0f0" stroke-width="0.8"/>
<line x1="80" y1="121" x2="970" y2="121" stroke="#f0f0f0" stroke-width="0.8"/>
<line x1="80" y1="167" x2="970" y2="167" stroke="#f0f0f0" stroke-width="0.8"/>
<line x1="80" y1="213" x2="970" y2="213" stroke="#f0f0f0" stroke-width="0.8"/>

<!-- USER/EVAL blocks (blue) — the majority of each loop -->
<rect x="80"  y="78" width="145" height="40" rx="3" fill="#1a6abf" fill-opacity="0.85"/>
<rect x="267" y="78" width="160" height="40" rx="3" fill="#1a6abf" fill-opacity="0.85"/>
<rect x="469" y="78" width="160" height="40" rx="3" fill="#1a6abf" fill-opacity="0.85"/>
<rect x="671" y="78" width="160" height="40" rx="3" fill="#1a6abf" fill-opacity="0.85"/>
<rect x="873" y="78" width="55"  height="40" rx="3" fill="#1a6abf" fill-opacity="0.85"/>

<!-- GC QUANTUM blocks (orange) — short, inserted at safe points -->
<rect x="225" y="124" width="42" height="40" rx="3" fill="#e8a020" fill-opacity="0.9"/>
<rect x="429" y="124" width="40" height="40" rx="3" fill="#e8a020" fill-opacity="0.9"/>
<rect x="631" y="124" width="40" height="40" rx="3" fill="#e8a020" fill-opacity="0.9"/>
<rect x="833" y="124" width="40" height="40" rx="3" fill="#e8a020" fill-opacity="0.9"/>

<!-- IDLE / BONUS GC blocks (green) — leftover slack -->
<rect x="928" y="170" width="42" height="40" rx="3" fill="#4cae4c" fill-opacity="0.7"/>

<!-- GC quantum annotation brace -->
<line x1="225" y1="122" x2="267" y2="122" stroke="#e8a020" stroke-width="1"/>
<line x1="225" y1="118" x2="225" y2="122" stroke="#e8a020" stroke-width="1"/>
<line x1="267" y1="118" x2="267" y2="122" stroke="#e8a020" stroke-width="1"/>
<text x="246" y="115" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="12.0" font-style="italic" fill="#e8a020">~50 µs</text>

<!-- Vertical alignment lines (dotted) showing quanta run in the gaps) -->
<line x1="225" y1="78" x2="225" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="267" y1="78" x2="267" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="429" y1="78" x2="429" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="469" y1="78" x2="469" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="631" y1="78" x2="631" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="671" y1="78" x2="671" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="833" y1="78" x2="833" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>
<line x1="873" y1="78" x2="873" y2="124" stroke="#e8a020" stroke-width="0.8" stroke-dasharray="3,2"/>

<!-- Loop-repeats arrow -->
<path d="M 970,98 Q 1015,98 1015,145 Q 1015,192 970,192" fill="none" stroke="#228844" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrloop)"/>
<text x="1020" y="148" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.0" font-style="italic" fill="#228844">loop</text>
<text x="1020" y="163" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.0" font-style="italic" fill="#228844">repeats</text>

<!-- Key callout box -->
<rect x="80" y="240" width="880" height="80" rx="6" fill="#f4f8ff" stroke="#8899aa" stroke-width="1"/>
<text x="95" y="262" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="14.2" font-weight="bold" fill="#00468c">Key property:</text>
<text x="95" y="282" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#0d1a2e">GC quanta are inserted at safe points between Scheme evaluations.  The control loop never pauses to collect garbage.</text>
<text x="95" y="302" text-anchor="start" font-family="Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#0d1a2e">Idle time at end of loop earns a bonus quantum.  Mark phase distributes work across many loops; sweep resets color bits.</text>

</svg>
