<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640"
     font-family="Arial, Helvetica, sans-serif">

  <title>LambLisp Role in a Typical Application Stack</title>

  <!-- ═══ LAYER BAND BACKGROUNDS ═══ -->
  <rect x="5"  y="35"  width="855" height="135" fill="#efffef" stroke="#b8d8b8" stroke-width="1" rx="5"/>
  <rect x="5"  y="190" width="855" height="112" fill="#fffff0" stroke="#d4d490" stroke-width="1" rx="5"/>
  <rect x="5"  y="322" width="855" height="152" fill="#eff0ff" stroke="#aab0e8" stroke-width="1" rx="5"/>
  <rect x="5"  y="494" width="855" height="90"  fill="#f5f5f5" stroke="#c0c0c0" stroke-width="1" rx="5"/>

  <!-- ═══ TITLE ═══ -->
  <text x="450" y="23" text-anchor="middle" font-size="14" font-weight="bold"
        text-decoration="underline" fill="#111">LambLisp Role in a Typical Application Stack</text>

  <!-- ═══ LAYER LABELS (left margin) ═══ -->
  <text x="12" y="95"  font-size="12" font-weight="bold" fill="#2a6a2a">Application</text>
  <text x="12" y="110" font-size="12" font-weight="bold" fill="#2a6a2a">layer</text>
  <text x="12" y="241" font-size="11" font-weight="bold" fill="#666600">Scheme</text>
  <text x="12" y="256" font-size="11" font-weight="bold" fill="#666600">libraries</text>
  <text x="12" y="386" font-size="12" font-weight="bold" fill="#1a3a8a">Runtime</text>
  <text x="12" y="401" font-size="12" font-weight="bold" fill="#1a3a8a">layer</text>
  <text x="12" y="533" font-size="12" font-weight="bold" fill="#333">Platform</text>
  <text x="12" y="548" font-size="12" font-weight="bold" fill="#333">layer</text>

  <!-- ═══ APPLICATION LAYER ═══ -->

  <!-- Row 1a: Application Controller -->
  <rect x="118" y="43" width="192" height="60" fill="white" stroke="#2a8a2a" stroke-width="2" rx="3"/>
  <text x="214" y="62"  text-anchor="middle" font-size="11" font-weight="bold" fill="#2a8a2a">Application Controller</text>
  <text x="214" y="77"  text-anchor="middle" font-size="10" fill="#444">main loop, setup, teardown</text>
  <text x="214" y="91"  text-anchor="middle" font-size="10" fill="#444">OTA update handler</text>

  <!-- Row 1b: Application Objects -->
  <rect x="325" y="43" width="178" height="60" fill="white" stroke="#2a8a2a" stroke-width="2" rx="3"/>
  <text x="414" y="62"  text-anchor="middle" font-size="11" font-weight="bold" fill="#2a8a2a">Application Objects</text>
  <text x="414" y="77"  text-anchor="middle" font-size="10" fill="#444">dict-&gt;obj, typed-obj</text>
  <text x="414" y="91"  text-anchor="middle" font-size="10" fill="#444">lobs-type?, inheritance</text>

  <!-- Row 1c: Control Algorithms -->
  <rect x="518" y="43" width="192" height="60" fill="white" stroke="#2a8a2a" stroke-width="2" rx="3"/>
  <text x="614" y="62"  text-anchor="middle" font-size="11" font-weight="bold" fill="#2a8a2a">Control Algorithms</text>
  <text x="614" y="77"  text-anchor="middle" font-size="10" fill="#444">PID, state machine</text>
  <text x="614" y="91"  text-anchor="middle" font-size="10" fill="#444">sensor fusion, scheduling</text>

  <!-- Row 2: Device Abstractions / HAL -->
  <rect x="118" y="111" width="592" height="50" fill="white" stroke="#2a8a2a" stroke-width="2" rx="3"/>
  <text x="414" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#2a8a2a">Device Abstractions / HAL</text>
  <text x="414" y="147" text-anchor="middle" font-size="10" fill="#444">typed sensor &amp; actuator objects — one per device class (PCA9685, BME280, …) — hide bus details from above</text>

  <!-- ═══ SCHEME LIBRARIES ═══ -->

  <!-- R7RS Libraries -->
  <rect x="118" y="198" width="188" height="95" fill="white" stroke="#888820" stroke-width="2" rx="3"/>
  <text x="212" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#666600">R7RS Libraries</text>
  <text x="212" y="232" text-anchor="middle" font-size="10" fill="#444">rxrs_ai.scm</text>
  <text x="212" y="246" text-anchor="middle" font-size="10" fill="#444">error, guard</text>
  <text x="212" y="260" text-anchor="middle" font-size="10" fill="#444">with-exception-handler</text>
  <text x="212" y="274" text-anchor="middle" font-size="10" fill="#444">string ports, bytevectors</text>
  <text x="212" y="286" text-anchor="middle" font-size="9"  font-style="italic" fill="#888">(Scheme)</text>

  <!-- Lobs / Containers -->
  <rect x="322" y="198" width="184" height="95" fill="white" stroke="#888820" stroke-width="2" rx="3"/>
  <text x="414" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#666600">Lobs / Containers</text>
  <text x="414" y="232" text-anchor="middle" font-size="10" fill="#444">Lobs.scm</text>
  <text x="414" y="246" text-anchor="middle" font-size="10" fill="#444">Queue, Stack, TimedQueue</text>
  <text x="414" y="260" text-anchor="middle" font-size="10" fill="#444">dict-&gt;obj, typed-obj</text>
  <text x="414" y="274" text-anchor="middle" font-size="10" fill="#444">lobs-type?</text>
  <text x="414" y="286" text-anchor="middle" font-size="9"  font-style="italic" fill="#888">(Scheme)</text>

  <!-- User Scheme Files -->
  <rect x="522" y="198" width="188" height="95" fill="white" stroke="#888820" stroke-width="2" rx="3"/>
  <text x="616" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#666600">User Scheme Files</text>
  <text x="616" y="232" text-anchor="middle" font-size="10" fill="#444">your .scm files</text>
  <text x="616" y="246" text-anchor="middle" font-size="10" fill="#444">loaded at startup</text>
  <text x="616" y="260" text-anchor="middle" font-size="10" fill="#444">via setup.scm</text>
  <text x="616" y="274" text-anchor="middle" font-size="10" fill="#444">or (load "..." 1)</text>
  <text x="616" y="286" text-anchor="middle" font-size="9"  font-style="italic" fill="#888">(Scheme)</text>

  <!-- ═══ RUNTIME LAYER  (left=lower dependency, right=higher) ═══ -->

  <!-- Hardware I/O — leftmost: no runtime deps -->
  <rect x="118" y="330" width="184" height="135" fill="white" stroke="#1a3a8a" stroke-width="2" rx="3"/>
  <text x="210" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a8a">Hardware I/O</text>
  <text x="210" y="366" text-anchor="middle" font-size="10" fill="#444">Pins, PWM, ADC</text>
  <text x="210" y="381" text-anchor="middle" font-size="10" fill="#444">I2C, SPI, UART</text>
  <text x="210" y="396" text-anchor="middle" font-size="10" fill="#444">WiFi, Ethernet</text>
  <text x="210" y="411" text-anchor="middle" font-size="10" fill="#444">Arduino API</text>
  <text x="210" y="426" text-anchor="middle" font-size="10" fill="#444">manufacturer C++ libs</text>
  <text x="210" y="457" text-anchor="middle" font-size="9"  font-style="italic" fill="#777">(C++)</text>

  <!-- C++ Runtime Libs — center: uses Hardware I/O (to left) -->
  <rect x="310" y="330" width="158" height="135" fill="white" stroke="#1a3a8a" stroke-width="2" rx="3"/>
  <text x="389" y="350" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a3a8a">C++ Runtime Libs</text>
  <text x="389" y="366" text-anchor="middle" font-size="10" fill="#444">printf, math</text>
  <text x="389" y="381" text-anchor="middle" font-size="10" fill="#444">new / delete / alloc</text>
  <text x="389" y="396" text-anchor="middle" font-size="10" fill="#444">newlib / glibc</text>
  <text x="389" y="411" text-anchor="middle" font-size="10" fill="#444">ESP-IDF / libstdc++</text>
  <text x="389" y="457" text-anchor="middle" font-size="9"  font-style="italic" fill="#777">(C++)</text>

  <!-- LambLisp VM — rightmost: uses Hardware I/O + C++ Runtime Libs (both to left) -->
  <rect x="476" y="330" width="234" height="135" fill="#fff6ee" stroke="#cc5500" stroke-width="3" rx="4"/>
  <text x="593" y="351" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc5500">LambLisp VM</text>
  <text x="593" y="368" text-anchor="middle" font-size="10" fill="#444">Reader · Evaluator · Tail-call trampoline</text>
  <text x="593" y="383" text-anchor="middle" font-size="10" fill="#444">Incremental GC (Yuasa tricolor)</text>
  <text x="593" y="398" text-anchor="middle" font-size="10" fill="#444">mop3 C++ extension API</text>
  <text x="593" y="413" text-anchor="middle" font-size="10" fill="#444">Bytecode compiler</text>
  <text x="593" y="428" text-anchor="middle" font-size="10" fill="#444">NCG JIT  (x86-64 · AArch64 · Xtensa LX7)</text>
  <text x="593" y="457" text-anchor="middle" font-size="9"  font-style="italic" fill="#cc5500">(C++ core)</text>

  <!-- ═══ PLATFORM LAYER ═══ -->
  <rect x="118" y="502" width="592" height="73" fill="white" stroke="#444" stroke-width="2" rx="3"/>
  <text x="414" y="522" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">Operating System / RTOS</text>
  <text x="414" y="539" text-anchor="middle" font-size="10" fill="#444">FreeRTOS (ESP32-S3)  ·  Linux kernel (x86-64  ·  AArch64 Jetson Orin Nano)</text>
  <text x="414" y="555" text-anchor="middle" font-size="10" fill="#444">threads · timers · TCP/IP stack · SPIFFS / POSIX filesystem</text>
  <text x="414" y="569" text-anchor="middle" font-size="9"  font-style="italic" fill="#777">ESP32-S3  ·  x86-64  ·  AArch64</text>

  <!-- ═══ INTER-LAYER ARROWS  (upward = "provides services to layer above") ═══ -->

  <!-- Platform → Runtime  (gap y=474-494) -->
  <line x1="210" y1="490" x2="210" y2="472" stroke="#666" stroke-width="1.5"/>
  <polygon points="205,476 210,468 215,476" fill="#666"/>

  <line x1="389" y1="490" x2="389" y2="472" stroke="#666" stroke-width="1.5"/>
  <polygon points="384,476 389,468 394,476" fill="#666"/>

  <line x1="593" y1="490" x2="593" y2="472" stroke="#cc5500" stroke-width="1.5"/>
  <polygon points="588,476 593,468 598,476" fill="#cc5500"/>

  <!-- Runtime → Scheme  (gap y=302-322) -->
  <line x1="210" y1="320" x2="210" y2="302" stroke="#666" stroke-width="1.5"/>
  <polygon points="205,306 210,298 215,306" fill="#666"/>

  <line x1="389" y1="320" x2="389" y2="302" stroke="#666" stroke-width="1.5"/>
  <polygon points="384,306 389,298 394,306" fill="#666"/>

  <line x1="593" y1="320" x2="593" y2="302" stroke="#cc5500" stroke-width="1.5"/>
  <polygon points="588,306 593,298 598,306" fill="#cc5500"/>

  <!-- Scheme → Application  (gap y=170-190) -->
  <line x1="212" y1="188" x2="212" y2="168" stroke="#888820" stroke-width="1.5"/>
  <polygon points="207,172 212,164 217,172" fill="#888820"/>

  <line x1="414" y1="188" x2="414" y2="168" stroke="#888820" stroke-width="1.5"/>
  <polygon points="409,172 414,164 419,172" fill="#888820"/>

  <line x1="616" y1="188" x2="616" y2="168" stroke="#888820" stroke-width="1.5"/>
  <polygon points="611,172 616,164 621,172" fill="#888820"/>

  <!-- ═══ LAMBLISP BRACKET  (spans Application + Scheme + Runtime) ═══ -->
  <line x1="722" y1="38"  x2="732" y2="38"  stroke="#cc5500" stroke-width="2"/>
  <line x1="732" y1="38"  x2="732" y2="468" stroke="#cc5500" stroke-width="2"/>
  <line x1="732" y1="468" x2="722" y2="468" stroke="#cc5500" stroke-width="2"/>
  <text transform="translate(762,253) rotate(90)"
        text-anchor="middle" font-size="16" font-weight="bold" fill="#cc5500">LambLisp</text>

  <!-- ═══ LEGEND  (inside platform band, right of platform box) ═══ -->
  <rect x="726" y="499" width="126" height="78" fill="white" stroke="#bbb" stroke-width="1" rx="3"/>
  <text x="789" y="514" text-anchor="middle" font-size="10" font-weight="bold" fill="#333">provides services to ↑</text>

  <!-- C++ layer arrow sample -->
  <line x1="735" y1="530" x2="755" y2="530" stroke="#666" stroke-width="1.5"/>
  <polygon points="750,527 755,530 750,533" fill="#666"/>
  <text x="760" y="534" font-size="10" fill="#333">C++ layer</text>

  <!-- Scheme layer arrow sample -->
  <line x1="735" y1="547" x2="755" y2="547" stroke="#888820" stroke-width="1.5"/>
  <polygon points="750,544 755,547 750,550" fill="#888820"/>
  <text x="760" y="551" font-size="10" fill="#333">Scheme layer</text>

  <!-- LambLisp VM arrow sample -->
  <line x1="735" y1="564" x2="755" y2="564" stroke="#cc5500" stroke-width="1.5"/>
  <polygon points="750,561 755,564 750,567" fill="#cc5500"/>
  <text x="760" y="568" font-size="10" fill="#333">LambLisp VM</text>

</svg>
