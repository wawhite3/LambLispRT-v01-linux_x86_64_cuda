<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
<rect width="720" height="440" fill="#ffffff"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#00468c"/>
  </marker>
  <marker id="arrs" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
    <polygon points="0 0,7 2.5,0 5" fill="#00468c"/>
  </marker>
</defs>

<!-- Title -->
<text x="360" y="26" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#00468c">Boustrophedon Coverage Path</text>
<text x="360" y="44" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" font-style="italic" fill="#556677">parallel strips, direction reversed each row — complete floor coverage guaranteed</text>

<!-- Room outline -->
<rect x="80" y="60" width="560" height="350" rx="4" fill="#f5f8ff" stroke="#334455" stroke-width="2"/>

<!-- Axis labels -->
<text x="360" y="428" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#556677">+X (east)  →  0 to 400 cm</text>
<text x="20" y="240" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#556677" transform="rotate(-90 20 240)">+Y (north)  0 to 300 cm</text>

<!-- Strip shading (alternating very light) -->
<rect x="80"  y="60"  width="560" height="70" fill="#eef4ff"/>
<rect x="80"  y="200" width="560" height="70" fill="#eef4ff"/>
<rect x="80"  y="340" width="560" height="70" fill="#eef4ff"/>

<!-- Strip dividers -->
<line x1="80"  y1="130" x2="640" y2="130" stroke="#c8d8ee" stroke-width="0.8" stroke-dasharray="4,3"/>
<line x1="80"  y1="200" x2="640" y2="200" stroke="#c8d8ee" stroke-width="0.8" stroke-dasharray="4,3"/>
<line x1="80"  y1="270" x2="640" y2="270" stroke="#c8d8ee" stroke-width="0.8" stroke-dasharray="4,3"/>
<line x1="80"  y1="340" x2="640" y2="340" stroke="#c8d8ee" stroke-width="0.8" stroke-dasharray="4,3"/>

<!-- Strip width brace -->
<line x1="655" y1="60"  x2="655" y2="130" stroke="#8899aa" stroke-width="1"/>
<line x1="650" y1="60"  x2="660" y2="60"  stroke="#8899aa" stroke-width="1"/>
<line x1="650" y1="130" x2="660" y2="130" stroke="#8899aa" stroke-width="1"/>
<text x="674" y="99" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#556677" transform="rotate(90 674 99)">40 cm</text>

<!-- ── Strip 1 (y=95, left→right) ── -->
<line x1="100" y1="95" x2="620" y2="95" stroke="#00468c" stroke-width="2.5" marker-end="url(#arr)"/>
<!-- waypoints on strip 1 -->
<circle cx="100" cy="95" r="5" fill="#00468c"/>
<circle cx="240" cy="95" r="4" fill="#4a90d9"/>
<circle cx="380" cy="95" r="4" fill="#4a90d9"/>
<circle cx="520" cy="95" r="4" fill="#4a90d9"/>
<circle cx="620" cy="95" r="5" fill="#00468c"/>

<!-- connector 1→2 -->
<path d="M620,95 Q635,95 635,130 Q635,165 620,165" fill="none" stroke="#00468c" stroke-width="2" stroke-dasharray="4,2"/>

<!-- ── Strip 2 (y=165, right→left) ── -->
<line x1="620" y1="165" x2="100" y2="165" stroke="#00468c" stroke-width="2.5" marker-end="url(#arr)"/>
<circle cx="620" cy="165" r="5" fill="#00468c"/>
<circle cx="480" cy="165" r="4" fill="#4a90d9"/>
<circle cx="340" cy="165" r="4" fill="#4a90d9"/>
<circle cx="200" cy="165" r="4" fill="#4a90d9"/>
<circle cx="100" cy="165" r="5" fill="#00468c"/>

<!-- connector 2→3 -->
<path d="M100,165 Q65,165 65,200 Q65,235 100,235" fill="none" stroke="#00468c" stroke-width="2" stroke-dasharray="4,2"/>

<!-- ── Strip 3 (y=235, left→right) ── -->
<line x1="100" y1="235" x2="620" y2="235" stroke="#00468c" stroke-width="2.5" marker-end="url(#arr)"/>
<circle cx="100" cy="235" r="5" fill="#00468c"/>
<circle cx="240" cy="235" r="4" fill="#4a90d9"/>
<circle cx="380" cy="235" r="4" fill="#4a90d9"/>
<circle cx="520" cy="235" r="4" fill="#4a90d9"/>
<circle cx="620" cy="235" r="5" fill="#00468c"/>

<!-- connector 3→4 -->
<path d="M620,235 Q635,235 635,270 Q635,305 620,305" fill="none" stroke="#00468c" stroke-width="2" stroke-dasharray="4,2"/>

<!-- ── Strip 4 (y=305, right→left) ── -->
<line x1="620" y1="305" x2="100" y2="305" stroke="#00468c" stroke-width="2.5" marker-end="url(#arr)"/>
<circle cx="620" cy="305" r="5" fill="#00468c"/>
<circle cx="480" cy="305" r="4" fill="#4a90d9"/>
<circle cx="340" cy="305" r="4" fill="#4a90d9"/>
<circle cx="200" cy="305" r="4" fill="#4a90d9"/>
<circle cx="100" cy="305" r="5" fill="#00468c"/>

<!-- connector 4→5 -->
<path d="M100,305 Q65,305 65,340 Q65,375 100,375" fill="none" stroke="#00468c" stroke-width="2" stroke-dasharray="4,2"/>

<!-- ── Strip 5 (y=375, left→right) ── -->
<line x1="100" y1="375" x2="620" y2="375" stroke="#00468c" stroke-width="2.5" marker-end="url(#arr)"/>
<circle cx="100" cy="375" r="5" fill="#00468c"/>
<circle cx="240" cy="375" r="4" fill="#4a90d9"/>
<circle cx="380" cy="375" r="4" fill="#4a90d9"/>
<circle cx="520" cy="375" r="4" fill="#4a90d9"/>
<circle cx="620" cy="375" r="5" fill="#00468c"/>

<!-- Start marker -->
<circle cx="100" cy="95" r="9" fill="none" stroke="#2a9d8f" stroke-width="2.5"/>
<text x="108" y="78" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#2a9d8f" font-weight="bold">start (0, 0)</text>

<!-- Legend -->
<rect x="82" y="62" width="130" height="44" rx="3" fill="#ffffff" fill-opacity="0.85" stroke="#c8d8ee" stroke-width="0.8"/>
<circle cx="97"  cy="76" r="5" fill="#00468c"/>
<text x="107" y="80" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#334455">turn / strip end</text>
<circle cx="97"  cy="96" r="4" fill="#4a90d9"/>
<text x="107" y="100" font-family="Helvetica Neue, Arial, sans-serif" font-size="10" fill="#334455">waypoint</text>

<!-- Direction label mid-strip 1 -->
<text x="360" y="82" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#00468c">strip 1  →</text>
<text x="360" y="180" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#00468c">←  strip 2</text>
<text x="360" y="222" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#00468c">strip 3  →</text>
<text x="360" y="320" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#00468c">←  strip 4</text>
<text x="360" y="362" text-anchor="middle"
      font-family="Helvetica Neue, Arial, sans-serif" font-size="10" font-style="italic" fill="#00468c">strip 5  →</text>
</svg>
