<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
<rect width="720" height="440" fill="#ffffff"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#00468c"/>
  </marker>
  <marker id="arrd" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#8899aa"/>
  </marker>
  <marker id="arro" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
    <polygon points="0 0,9 3.5,0 7" fill="#cc8800"/>
  </marker>
</defs>

<!-- Title -->
<text x="360" y="28" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="bold" fill="#00468c">LLFSP Connection Lifecycle</text>

<!-- Client lifeline header -->
<rect x="80" y="50" width="120" height="36" rx="6" fill="#4a90d9" stroke="#00468c" stroke-width="1.5"/>
<text x="140" y="73" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#ffffff">client</text>

<!-- Server lifeline header -->
<rect x="520" y="50" width="120" height="36" rx="6" fill="#4a90d9" stroke="#00468c" stroke-width="1.5"/>
<text x="580" y="73" text-anchor="middle" font-family="Courier New, monospace" font-size="15" font-weight="bold" fill="#ffffff">server</text>

<!-- Lifelines -->
<line x1="140" y1="86" x2="140" y2="410" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,3"/>
<line x1="580" y1="86" x2="580" y2="410" stroke="#4a90d9" stroke-width="1.5" stroke-dasharray="5,3"/>

<!-- Activation boxes (thin vertical rects showing when each side is active) -->
<rect x="134" y="120" width="12" height="270" rx="2" fill="#d0e8ff" stroke="#4a90d9" stroke-width="1"/>
<rect x="574" y="86" width="12" height="310" rx="2" fill="#d0e8ff" stroke="#4a90d9" stroke-width="1"/>

<!-- Step 1: server → client: (hello) -->
<line x1="574" y1="120" x2="152" y2="120" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="113" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(hello)</text>
<text x="360" y="134" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#8899aa">server speaks first</text>

<!-- Step 2: client → server: (auth token) -->
<line x1="152" y1="163" x2="574" y2="163" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="156" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(auth "token")</text>
<text x="360" y="177" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#8899aa">client authenticates</text>

<!-- Step 3: server → client: (ok) or (error ...) -->
<line x1="574" y1="205" x2="152" y2="205" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="198" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(ok) or (error "bad token")</text>

<!-- Repeat bracket -->
<rect x="50" y="225" width="620" height="85" rx="5" fill="none" stroke="#8899aa" stroke-width="1" stroke-dasharray="6,3"/>
<text x="58" y="220" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#8899aa">repeat</text>

<!-- Step 4: client → server: (op args...) -->
<line x1="152" y1="248" x2="574" y2="248" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="241" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(op args ...)</text>
<text x="360" y="262" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#8899aa">any operation: ls, read, write, eval, ...</text>

<!-- Step 5: server → client: (ok result) or error -->
<line x1="574" y1="292" x2="152" y2="292" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="285" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(ok result) or (error "msg")</text>

<!-- Step 6: client → server: (bye) -->
<line x1="152" y1="335" x2="574" y2="335" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="328" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(bye)</text>

<!-- Step 7: server → client: (ok) -->
<line x1="574" y1="363" x2="152" y2="363" stroke="#00468c" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="360" y="356" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#00468c">(ok)</text>

<!-- Server closes port -->
<rect x="548" y="374" width="64" height="18" rx="3" fill="#ffe8b0" stroke="#cc8800" stroke-width="1"/>
<text x="580" y="387" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="11" fill="#cc8800">closes port</text>

<!-- End caps on lifelines -->
<line x1="125" y1="410" x2="155" y2="410" stroke="#4a90d9" stroke-width="2"/>
<line x1="565" y1="396" x2="595" y2="396" stroke="#4a90d9" stroke-width="2"/>

</svg>
